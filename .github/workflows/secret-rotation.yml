name: secret-rotation

# ─────────────────────────────────────────────────────────────────────────────
# Monthly rotation of the bot AAD client secret.
#
# Steps:
#   1) az ad app credential reset --append (180-day lifetime, keeps the old
#      one valid until next run for zero-downtime).
#   2) Write new secret value to KV `bot-aad-secret`.
#   3) Trigger VMSS rolling-upgrade so each instance re-runs install.ps1 and
#      picks the new secret from KV → restarts the bot service with new env.
#   4) After 30 days (separate cleanup run) revoke the previous credential.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 3 1 * *'   # 03:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      cleanup_old:
        description: 'Also revoke previous credentials older than 30 days'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AAD_APP_ID_SECRET_NAME: bot-aad-app-id
  AAD_SECRET_NAME: bot-aad-secret

jobs:
  resolve:
    if: vars.AZURE_RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      key_vault: ${{ steps.out.outputs.key_vault }}
      vmss_name: ${{ steps.out.outputs.vmss_name }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: out
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          DEPLOYMENT_NAME: ${{ vars.INFRA_DEPLOYMENT_NAME }}
        run: |
          set -euo pipefail
          DN="${DEPLOYMENT_NAME:-main}"
          OUT=$(az deployment group show -g "$RG" -n "$DN" --query properties.outputs -o json)
          echo "key_vault=$(echo "$OUT" | jq -r '.keyVaultName.value')" >> "$GITHUB_OUTPUT"
          echo "vmss_name=$(echo "$OUT" | jq -r '.vmssName.value')"      >> "$GITHUB_OUTPUT"

  rotate:
    needs: resolve
    runs-on: ubuntu-latest
    environment: prod
    env:
      KV_NAME: ${{ needs.resolve.outputs.key_vault }}
      VMSS_NAME: ${{ needs.resolve.outputs.vmss_name }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve AAD app id from KV
        id: app
        run: |
          APP_ID=$(az keyvault secret show --vault-name "$KV_NAME" -n "$AAD_APP_ID_SECRET_NAME" --query value -o tsv)
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Reset (append) AAD client secret
        id: reset
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          DISPLAY="rotated-$(date -u +%Y%m%d)"
          OUT=$(az ad app credential reset --id "$APP_ID" --append --display-name "$DISPLAY" --years 1 -o json)
          PASS=$(echo "$OUT" | jq -r '.password')
          echo "::add-mask::$PASS"
          echo "new_pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Write to KV
        env:
          NEW_PASS: ${{ steps.reset.outputs.new_pass }}
        run: |
          az keyvault secret set --vault-name "$KV_NAME" -n "$AAD_SECRET_NAME" --value "$NEW_PASS" --output none

      - name: Roll VMSS (instances re-run install.ps1 → pick up new KV value)
        run: |
          az vmss update-instances -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$VMSS_NAME" --instance-ids '*'

      - name: Cleanup old credentials
        if: ${{ inputs.cleanup_old }}
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          CUTOFF=$(date -u -d '30 days ago' +%s)
          for KEY_ID in $(az ad app credential list --id "$APP_ID" --query "[?startDateTime!=null].keyId" -o tsv); do
            CREATED=$(az ad app credential list --id "$APP_ID" --query "[?keyId=='$KEY_ID'].startDateTime | [0]" -o tsv)
            CREATED_TS=$(date -u -d "$CREATED" +%s)
            if [ "$CREATED_TS" -lt "$CUTOFF" ]; then
              echo "Revoking $KEY_ID (created $CREATED)"
              az ad app credential delete --id "$APP_ID" --key-id "$KEY_ID"
            fi
          done
