[project]
name = "teams_avatar_voice_live"
version = "0.1.3"
description = "AI agent that joins Microsoft Teams meetings as a video avatar via Azure Voice Live"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "glejdis" }]
keywords = ["teams", "avatar", "voice-live", "foundry", "microsoft-graph"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Conferencing",
]

# Runtime deps for `core/` + `launcher/`. The `hosted-agent/` and
# `browser-fallback/` apps have their own requirements.txt (they ship as
# independent containers / dev servers).
dependencies = [
    "requests>=2.31",
    "msal>=1.28",
    "python-dotenv>=1.0",
    "azure-identity>=1.19",
]

[project.optional-dependencies]
# `pip install -e .[web]` to enable `launcher.web` (FastAPI wrapper).
# Plain `uvicorn` (no `[standard]` extra) — `[standard]` pulls uvloop which
# has no wheels for Windows ARM64; bare uvicorn works everywhere.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.5",
]
# `pip install -e .[test]` for the unit-test suite.
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
]

[project.scripts]
tva-launcher = "launcher.cli:main"

[project.urls]
Homepage = "https://github.com/glejdis/teams_avatar_voice_live"
Issues = "https://github.com/glejdis/teams_avatar_voice_live/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "launcher*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear.
# `UP` (pyupgrade) intentionally not selected — `core/` predates Python 3.10
# typing-union syntax and we don't want a noisy mass-rewrite of imports.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # line-length handled by formatter

[tool.pytest.ini_options]
# Tests live next to the packages they cover. The `bot/` submodule and
# `browser-fallback/` ship their own test suites with their own deps; pytest
# from the root must not try to collect them.
testpaths = ["tests", "core", "launcher"]
norecursedirs = ["bot", "browser-fallback", "hosted-agent", "infra", ".venv"]
